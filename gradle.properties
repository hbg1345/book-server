# The daemon holds the Gatling run's console output and report generation, and the report parser
# reads the whole simulation log. A long high-load run produces enough of both to push the default
# heap into GC thrash, which Gradle reports as "build daemon has been stopped: since the JVM
# garbage collector is thrashing" — a client-side failure that is easy to mistake for the server
# under test having failed.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

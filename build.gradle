plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'com.epages.restdocs-api-spec' version '0.20.1'   // generates an OpenAPI 3 spec from the same RestDocs tests (0.20.x = Spring Boot 4 compatible)
    id 'io.gatling.gradle' version '3.15.1.2'            // load-test simulations in src/gatling (never part of `build` or CI)
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'book-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // jakarta bean validation (@Valid)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.postgresql:postgresql'   // compile-scoped: the V3 Flyway Java migration uses CopyManager directly
    runtimeOnly 'com.google.cloud.sql:postgres-socket-factory:1.29.0'   // Cloud SQL connector (prod only; dormant locally)
    implementation platform('com.google.cloud:libraries-bom:26.50.0')
    implementation 'com.google.cloud:google-cloud-tasks'   // schedule per-order expiry tasks (prod only; disabled locally)
    implementation 'org.springframework.boot:spring-boot-starter-flyway' // Flyway + Boot 4 autoconfig (split into its own module in Boot 4; flyway-core alone does NOT run migrations on startup)
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'                // Flyway's Postgres support module
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.1.0'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'   // wraps document() to also emit OpenAPI
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    implementation 'com.stripe:stripe-java:29.2.0'   // payment provider adapter (#25)
    implementation 'com.github.f4b6a3:uuid-creator:6.1.1'   // UUIDv7 (time-ordered) id generation
    implementation 'org.springframework.boot:spring-boot-starter-security'   // authn/authz filter chain
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'                          // JWT (access token)
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.security:spring-security-test'   // @WithMockUser etc.
}

tasks.named('test') {
    outputs.dir snippetsDir
    // Flyway builds the test schema too (single source of truth, no drift with prod).
    // All migrations run, but the V3 catalog-seed migration is told to copy nothing via
    // this flag, so the schema (incl. V4 user role) is built without the heavy load.
    // We do NOT use spring.flyway.target to skip it: the seed is already applied as V3 in
    // production, and reordering migrations would break Flyway validation there. Tests
    // reset rows between methods via @Sql("/reset.sql").
    systemProperty 'catalogSeed.skip', 'true'
    // There is no fallback PaymentGateway any more: without a key the context cannot start (by
    // design — see PaymentGatewayConfig). A dummy key lets @SpringBootTest boot the real wiring,
    // which also keeps those tests a guard that the production path is constructible. Nothing
    // calls Stripe: building the client makes no request, and payment tests mock the gateway.
    systemProperty 'stripe.secret-key', 'sk_test_dummy_not_a_real_key'
    systemProperty 'stripe.webhook-secret', 'whsec_dummy_not_a_real_secret'
    useJUnitPlatform {
        excludeTags 'benchmark'   // keep the heavy 1M-row benchmark out of the normal test run
        excludeTags 'contract'    // and the sandbox contract, which needs a real key and a network
    }
}

// run with:  ./gradlew contractTest
//
// Contract tests against the real Stripe sandbox. Kept out of `test` because they need a
// test-mode key and a network: CI has neither, and a build that goes red when someone else's
// service is slow teaches people to ignore red builds. Without a key they skip, not fail.
tasks.register('contractTest', Test) {
    description = 'Runs the Stripe sandbox contract tests (real API calls, test mode only).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'contract'
    }
    // The key comes from the environment. A local .env is read as a convenience so the same file
    // that runs `docker compose up` runs these — it is gitignored and never leaves the machine.
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def matcher = line =~ /^\s*([A-Z][A-Z0-9_]*)=(.*)$/
            if (matcher) {
                environment(matcher[0][1], matcher[0][2].trim().replaceAll(/^["']|["']$/, ''))
            }
        }
    }
    outputs.upToDateWhen { false }   // always re-run; the point is to ask the live API
    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed'
    }
}

// run with:  ./gradlew benchmark
tasks.register('benchmark', Test) {
    description = 'Runs UUID v4 vs v7 benchmarks (heavy).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    outputs.upToDateWhen { false }   // always re-run
    testLogging {
        showStandardStreams = true   // print the benchmark report to the console
    }
}

// Load tests. Simulations live in src/gatling/java; see LOAD_TEST_GUIDE.md.
//
//   bash gradlew gatlingRun --simulation=com.example.bookserver.loadtest.BreakPointSimulation
//
// Deliberately not wired into `build` or `check`: these fire real traffic at the deployed Cloud
// Run revision, so they must be something a person chooses to run, never a side effect of a
// build. CI never invokes them.
// Forward `-Pusers=100` style invocation properties to the Gatling JVM as system properties,
// which is where LoadTestConfig reads them. Without this the simulations would only ever see
// their defaults, since Gatling runs in a separate process from the Gradle daemon.
def loadTestProps = ['baseUrl', 'users', 'baselineUsers', 'spikeUsers', 'maxUsers',
                     'duration', 'rampUp', 'recovery', 'beforeSpike', 'spikeHold', 'afterSpike',
                     'thinkTime', 'thinkTimeMin', 'thinkTimeMax', 'warmupRequests',
                     'titleSearchPct', 'shareConnections']
        .findAll { project.hasProperty(it) }
        .collect { "-D${it}=${project.property(it)}".toString() }

gatling {
    // Append rather than assign. The plugin's defaults carry the `--add-opens` flags Gatling
    // needs to reach JDK internals; replacing the list drops them and every run dies with
    // "module java.base does not open java.lang" before the first request is sent.
    //
    // The heap override raises Gatling's 1G default. Each virtual user carries session state and
    // each request is buffered until written to the log, so a few thousand concurrent users push
    // a 1G heap into GC thrash — which surfaces as the run dying mid-ramp, indistinguishable at a
    // glance from the server having buckled. Override with -PgatlingHeap=4g for larger runs.
    jvmArgs = jvmArgs + ["-Xmx${project.findProperty('gatlingHeap') ?: '2g'}".toString()] + loadTestProps
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    attributes 'snippets': snippetsDir   // lets index.adoc reference {snippets}/...
    dependsOn test
}

// Emit a single OpenAPI 3 spec (build/api-spec/openapi3.yaml) from the RestDocs tests.
// `server` is the deployed Cloud Run URL so Swagger UI's "Try it out" hits the live API.
openapi3 {
    server = 'https://book-server-912285810536.asia-northeast3.run.app'
    title = 'Book Server API'
    description = 'Online bookstore REST API (JWT auth: send Authorization: Bearer <accessToken>).'
    version = project.version
    format = 'yaml'
    outputDirectory = 'build/api-spec'
    outputFileNamePrefix = 'openapi3'
}

// The spec is built from the `resource.json` snippets the tests emit, so tests must run first.
// The plugin registers `openapi3` late (afterEvaluate), so match it lazily rather than by name.
tasks.matching { it.name == 'openapi3' }.configureEach {
    dependsOn test
}

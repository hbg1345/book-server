plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'com.epages.restdocs-api-spec' version '0.20.1'   // generates an OpenAPI 3 spec from the same RestDocs tests (0.20.x = Spring Boot 4 compatible)
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'book-server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'   // jakarta bean validation (@Valid)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.postgresql:postgresql'   // compile-scoped: the V3 Flyway Java migration uses CopyManager directly
    runtimeOnly 'com.google.cloud.sql:postgres-socket-factory:1.29.0'   // Cloud SQL connector (prod only; dormant locally)
    implementation platform('com.google.cloud:libraries-bom:26.50.0')
    implementation 'com.google.cloud:google-cloud-tasks'   // schedule per-order expiry tasks (prod only; disabled locally)
    implementation 'org.springframework.boot:spring-boot-starter-flyway' // Flyway + Boot 4 autoconfig (split into its own module in Boot 4; flyway-core alone does NOT run migrations on startup)
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'                // Flyway's Postgres support module
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.1.0'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'   // wraps document() to also emit OpenAPI
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    implementation 'com.github.f4b6a3:uuid-creator:6.1.1'   // UUIDv7 (time-ordered) id generation
    implementation 'org.springframework.boot:spring-boot-starter-security'   // authn/authz filter chain
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'                          // JWT (access token)
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.security:spring-security-test'   // @WithMockUser etc.
}

tasks.named('test') {
    outputs.dir snippetsDir
    // Flyway builds the test schema too (single source of truth, no drift with prod).
    // All migrations run, but the V3 catalog-seed migration is told to copy nothing via
    // this flag, so the schema (incl. V4 user role) is built without the heavy load.
    // We do NOT use spring.flyway.target to skip it: the seed is already applied as V3 in
    // production, and reordering migrations would break Flyway validation there. Tests
    // reset rows between methods via @Sql("/reset.sql").
    systemProperty 'catalogSeed.skip', 'true'
    useJUnitPlatform {
        excludeTags 'benchmark'   // keep the heavy 1M-row benchmark out of the normal test run
    }
}

// run with:  ./gradlew benchmark
tasks.register('benchmark', Test) {
    description = 'Runs UUID v4 vs v7 benchmarks (heavy).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    outputs.upToDateWhen { false }   // always re-run
    testLogging {
        showStandardStreams = true   // print the benchmark report to the console
    }
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    attributes 'snippets': snippetsDir   // lets index.adoc reference {snippets}/...
    dependsOn test
}

// Emit a single OpenAPI 3 spec (build/api-spec/openapi3.yaml) from the RestDocs tests.
// `server` is the deployed Cloud Run URL so Swagger UI's "Try it out" hits the live API.
openapi3 {
    server = 'https://book-server-912285810536.asia-northeast3.run.app'
    title = 'Book Server API'
    description = 'Online bookstore REST API (JWT auth: send Authorization: Bearer <accessToken>).'
    version = project.version
    format = 'yaml'
    outputDirectory = 'build/api-spec'
    outputFileNamePrefix = 'openapi3'
}

// The spec is built from the `resource.json` snippets the tests emit, so tests must run first.
// The plugin registers `openapi3` late (afterEvaluate), so match it lazily rather than by name.
tasks.matching { it.name == 'openapi3' }.configureEach {
    dependsOn test
}

spring.application.name=book-server
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.bookserver
# DB connection — overridable via env (SPRING_DATASOURCE_* also work via relaxed binding).
# Defaults target a local Postgres for `./gradlew bootRun`; docker-compose injects its own.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bookpass}

# JWT — secret MUST be set via env var in prod (>= 32 bytes for HS256). Dev fallback only.
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please!!}
jwt.access-token-ttl=3600s
jwt.refresh-token-ttl=1209600s

# Admin bootstrap — OFF by default. Catalog writes (book/author) require the ADMIN role,
# and self-registration only grants USER, so this is the sole way to obtain an admin.
# Enable it for a LOCAL/docker run to try the write endpoints; leave it disabled on the
# public deployment so the live catalog has no admin. All values overridable via env.
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.user-id=${ADMIN_BOOTSTRAP_USER_ID:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
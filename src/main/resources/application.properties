spring.application.name=book-server
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.bookserver
# DB connection — overridable via env (SPRING_DATASOURCE_* also work via relaxed binding).
# Defaults target a local Postgres for `./gradlew bootRun`; docker-compose injects its own.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bookpass}

# JWT — secret MUST be set via env var in prod (>= 32 bytes for HS256). Dev fallback only.
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please!!}
jwt.access-token-ttl=3600s
jwt.refresh-token-ttl=1209600s

# Orders: how long an order may sit in PAYMENT_PENDING before it is cancelled and its
# reserved stock released (ISO-8601 duration). The sweep is triggered externally (Cloud
# Scheduler -> POST /internal/orders/expire-unpaid), not by an in-process timer, so it
# works with Cloud Run scale-to-zero.
order.payment-timeout=${ORDER_PAYMENT_TIMEOUT:PT30M}

# Shared secret guarding /internal/** (sent as X-Internal-Token). Empty by default, which
# rejects every call; set a real value in prod (and on the Cloud Scheduler job).
internal.sweep-token=${INTERNAL_SWEEP_TOKEN:}

# Per-order expiry via Cloud Tasks (precise, hybrid with the sweep). OFF by default so
# local/docker/CI need no GCP; the periodic sweep alone handles expiry there. In prod set
# enabled=true and the queue coordinates; scheduled tasks POST /internal/orders/{id}/expire.
order.expiry.cloud-tasks.enabled=${ORDER_EXPIRY_CLOUD_TASKS_ENABLED:false}
gcp.project-id=${GCP_PROJECT_ID:}
order.expiry.cloud-tasks.location=${ORDER_EXPIRY_QUEUE_LOCATION:}
order.expiry.cloud-tasks.queue=${ORDER_EXPIRY_QUEUE:}
order.expiry.cloud-tasks.target-base-url=${ORDER_EXPIRY_TARGET_BASE_URL:}

# Admin bootstrap — OFF by default. Catalog writes (book/author) require the ADMIN role,
# and self-registration only grants USER, so this is the sole way to obtain an admin.
# Enable it for a LOCAL/docker run to try the write endpoints; leave it disabled on the
# public deployment so the live catalog has no admin. All values overridable via env.
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.user-id=${ADMIN_BOOTSTRAP_USER_ID:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
# Stripe (#25). Deliberately NOT given empty defaults here: a property defined as "" still
# counts as present, which would activate the Stripe adapter with a blank key. Left undefined,
# the app falls back to a gateway that refuses every charge, so a deployment missing its keys
# fails closed instead of silently "paying" for orders. Set them as environment variables —
# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET bind to stripe.secret-key / stripe.webhook-secret
# by relaxed binding. Both come from the Stripe dashboard; the webhook secret (whsec_..., which
# `stripe listen` prints locally) is what authenticates POSTs to /api/webhooks/stripe.
stripe.currency=${STRIPE_CURRENCY:usd}

# Local stack: the app + its PostgreSQL. Bring it up with:  docker compose up --build
# Values can be overridden from a .env file or the shell (VAR=... docker compose up).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookdb}
      POSTGRES_USER: ${POSTGRES_USER:-bookuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is NOT created here — the app owns it via Flyway (V1 schema, V2 category,
      # V3 catalog seed), so it runs identically in docker, local bootRun, and prod.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookuser} -d ${POSTGRES_DB:-bookdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bookpass}
      # dev-only secret; set a real one in prod (>= 32 bytes for HS256)
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-please!!}
      # Guards /internal/** (expiry sweep, payment health). Unset it and those endpoints reject
      # everything, which is the right default in prod but makes them untestable locally.
      INTERNAL_SWEEP_TOKEN: ${INTERNAL_SWEEP_TOKEN:-dev-only-internal-token}
      # Stripe test-mode keys — REQUIRED, deliberately with no default: there is no fallback
      # gateway, so the app refuses to start without one rather than booting unable to charge.
      # Put them in a .env file next to this one (gitignored); see .env.example.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:

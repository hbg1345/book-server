# Local stack: the app + its PostgreSQL. Bring it up with:  docker compose up --build
# Values can be overridden from a .env file or the shell (VAR=... docker compose up).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookdb}
      POSTGRES_USER: ${POSTGRES_USER:-bookuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, on first init of an empty data dir, to create the schema
      - ./src/test/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookuser} -d ${POSTGRES_DB:-bookdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bookpass}
      # dev-only secret; set a real one in prod (>= 32 bytes for HS256)
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-please!!}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:

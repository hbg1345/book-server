name: CI

# When to run this workflow
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Permissions the Pages deploy needs (read is enough for the build itself)
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub-hosted runner (Docker is preinstalled)

    steps:
      # 1. Check out the repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Run the full test suite AND assemble the REST Docs site in ONE run.
      #    asciidoctor dependsOn test, so the snippets the tests emit are reused —
      #    the suite runs once, not a second time just for docs.
      #    (Testcontainers spins up PostgreSQL via the runner's Docker.)
      - name: Run tests and build API docs
        run: bash ./gradlew asciidoctor

      # 4. Package the generated docs for Pages — only on push to master (skip on PRs)
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/asciidoc

  # Deploy the docs to GitHub Pages — only on push to master
  deploy-docs:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

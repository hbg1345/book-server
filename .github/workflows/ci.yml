name: CI

# When to run this workflow
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Permissions the Pages deploy needs (read is enough for the build itself)
permissions:
  contents: read
  pages: write
  id-token: write   # also used by Workload Identity Federation for the Cloud Run deploy

# Only one Pages deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub-hosted runner (Docker is preinstalled)

    steps:
      # 1. Check out the repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Run the full test suite AND assemble the REST Docs site in ONE run.
      #    asciidoctor dependsOn test, so the snippets the tests emit are reused —
      #    the suite runs once, not a second time just for docs.
      #    (Testcontainers spins up PostgreSQL via the runner's Docker.)
      - name: Run tests and build API docs
        run: bash ./gradlew asciidoctor openapi3

      # 4. Assemble the Pages site: Swagger UI + the generated OpenAPI spec.
      #    (Swagger UI fetches ./openapi3.yaml, so both live in the same folder.)
      - name: Assemble docs site
        if: github.event_name == 'push'
        run: |
          mkdir -p site
          cp src/docs/swagger-ui/index.html site/index.html
          cp build/api-spec/openapi3.yaml site/openapi3.yaml

      # 5. Package the site for Pages — only on push to master (skip on PRs)
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy the docs to GitHub Pages — only on push to master
  deploy-docs:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Build the app image, push it to Artifact Registry, and roll out a new Cloud Run
  # revision. Only on push to master, and only after tests pass (needs: test).
  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    # Non-secret config lives in repo Variables; secrets in repo Secrets / GCP Secret Manager.
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/book-server:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Exchange the GitHub OIDC token for short-lived GCP creds — no long-lived key file.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Let docker push to the regional Artifact Registry host.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Deploy. Cloud SQL is reached via the socket factory:
      #  - --add-cloudsql-instances mounts the instance for the connector
      #  - the JDBC URL names the instance + socketFactory (no host/port, no VPC)
      #  - password, JWT secret, sweep token & the Stripe keys come from GCP Secret Manager.
      #    STRIPE_SECRET_KEY is mandatory: there is no fallback gateway, so a revision without
      #    it fails to start rather than booting unable to take payments (see PaymentGatewayConfig).
      #  - the order.expiry.cloud-tasks.* env turns on per-order Cloud Tasks expiry; the
      #    matching queue + Cloud Scheduler safety-net job are provisioned once (see README).
      #    Requires repo Variables: ORDER_EXPIRY_QUEUE, CLOUD_RUN_BASE_URL; and repo/GCP
      #    Secret: INTERNAL_SWEEP_TOKEN.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars "SPRING_DATASOURCE_URL=jdbc:postgresql:///${{ vars.DB_NAME }}?cloudSqlInstance=${{ vars.CLOUD_SQL_INSTANCE }}&socketFactory=com.google.cloud.sql.postgres.SocketFactory,SPRING_DATASOURCE_USERNAME=${{ vars.DB_USER }},ORDER_EXPIRY_CLOUD_TASKS_ENABLED=true,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},ORDER_EXPIRY_QUEUE_LOCATION=${{ vars.GCP_REGION }},ORDER_EXPIRY_QUEUE=${{ vars.ORDER_EXPIRY_QUEUE }},ORDER_EXPIRY_TARGET_BASE_URL=${{ vars.CLOUD_RUN_BASE_URL }}" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,INTERNAL_SWEEP_TOKEN=INTERNAL_SWEEP_TOKEN:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest"

name: CI

# When to run this workflow
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub-hosted runner (Docker is preinstalled)

    steps:
      # 1. Check out the repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Make the Gradle wrapper executable (Linux runner)
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Run the tests (Testcontainers spins up PostgreSQL via the runner's Docker)
      - name: Run tests
        run: ./gradlew test
